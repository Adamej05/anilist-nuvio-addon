name: Build ID mapping

on:
  schedule:
    - cron: "23 4 * * *" # every day 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-mapping.ts
      - src/mappingFormat.ts
      - .github/workflows/mapping.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build compact mapping
        run: node scripts/build-mapping.ts out/mapping.json
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapping.json
          git commit -q -m "Mapping $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
